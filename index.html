<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>روضة هدايات</title>
  <meta name="description" content="روضة هدايات">
  <link rel="stylesheet" href="css/fonts.css?v=4.9">
  <link rel="stylesheet" href="css/styles.css?v=4.9">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="container">
      <nav class="header-nav">
        <a href="javascript:void(0)" class="brand-logo" onclick="resetFilters()" style="cursor:pointer;">
          <div class="brand-crest">
            <svg width="38" height="38" viewBox="0 0 100 100" fill="none">
              <polygon points="50,5 95,50 50,95 5,50" fill="#1a365d" stroke="#b68936" stroke-width="3" />
              <polygon points="50,16 84,50 50,84 16,50" fill="#c59f52" stroke="#1a365d" stroke-width="1.5" />
              <polygon points="50,34 66,50 50,66 34,50" fill="#1a365d" stroke="#b68936" stroke-width="1" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>روضة هدايات</h1>
          </div>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container">
    <!-- Hero Section -->
    <section class="hero-section">
      <h2 class="hero-title-arabic">روضة هدايات</h2>

      <!-- Search Box -->
      <div class="search-wrapper">
        <div class="search-box">
          <svg class="search-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder=""
            autocomplete="off"
            spellcheck="false"
          >
          <button id="searchClearBtn" class="search-clear-btn" title="Clear Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <select id="searchScopeSelect" class="search-scope-select" onchange="setScope(this.value)" title="Search Scope">
            <option value="all">🔍 All Fields</option>
            <option value="arabic">📜 Arabic Only</option>
            <option value="ld">📖 Lisan al-Dawat Only</option>
            <option value="english">🌐 English Only</option>
            <option value="stated_by">👤 Speaker Only</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Filters and Controls Bar -->
    <section class="filter-bar">
      <div class="filter-top-row">
        <!-- Volume Tabs -->
        <div class="volume-tabs">
          <button class="vol-tab active" data-vol="all" onclick="setVolume('all')">الكل</button>
          <button class="vol-tab" data-vol="روضة هدايات 1" onclick="setVolume('روضة هدايات 1')">روضة هدايات 1</button>
          <button class="vol-tab" data-vol="روضة هدايات 2" onclick="setVolume('روضة هدايات 2')">روضة هدايات 2</button>
          <button class="vol-tab" data-vol="روضة هدايات 3" onclick="setVolume('روضة هدايات 3')">روضة هدايات 3</button>
        </div>

        <!-- Speaker Filter, Sort & View Controls -->
        <div class="filter-controls-group">
          <select id="speakerSelect" class="select-control" onchange="setSpeaker(this.value)">
            <option value="all">All Speakers & Personalities</option>
          </select>

          <select id="sortSelect" class="select-control" onchange="setSort(this.value)">
            <option value="default">Sort: Default Order</option>
            <option value="serial_asc">Sort: Serial # (Ascending)</option>
            <option value="serial_desc">Sort: Serial # (Descending)</option>
            <option value="arabic_asc">Sort: Arabic (Alphabetical)</option>
            <option value="english_asc">Sort: English (A-Z)</option>
          </select>

          <!-- View Toggle (Grid / Table) -->
          <div class="view-toggle">
            <button class="view-btn active" data-view="grid" onclick="setViewMode('grid')" title="Grid Card View">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button class="view-btn" data-view="table" onclick="setViewMode('table')" title="Compact Table View">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Results Status Bar -->
    <div class="results-summary-bar">
      <div id="resultsCount">Loading records...</div>
      <div id="activeFilterChips" class="active-filters-chips"></div>
    </div>

    <!-- Results Dynamic Container -->
    <div id="resultsContainer"></div>

    <!-- Pagination -->
    <div id="paginationBar" class="pagination-bar"></div>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal-backdrop">
    <div class="modal-container" id="detailModalContainer"></div>
  </div>

  <!-- Statistics Modal -->
  <div id="statsModal" class="modal-backdrop">
    <div class="modal-container" style="max-width: 650px;">
      <div class="modal-header">
        <h3 style="font-size:1.15rem;font-weight:700;">📊 Dataset Analytics & Statistics</h3>
        <button class="icon-btn-sm" onclick="closeStatsModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" id="statsModalBody"></div>
      <div class="modal-footer" style="justify-content: flex-end;">
        <button class="btn btn-primary" onclick="closeStatsModal()">Close</button>
      </div>
    </div>
  </div>

  <!-- App Footer -->
  <footer class="app-footer">
    <div class="container">
      <p style="font-size:0.85rem;color:var(--text-muted);letter-spacing:0.02em;">Developed by : Shabbir Maanak</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="data/raudat_data.js?v=4.9"></script>
  <script src="js/app.js?v=4.9"></script>
</body>
</html>
